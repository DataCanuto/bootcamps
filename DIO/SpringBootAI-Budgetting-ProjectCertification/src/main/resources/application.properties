spring.application.name=budgeting
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# CRITICAL: Disable Docker Compose auto-startup if Docker is not available
# This allows the application to run without Docker installed
spring.docker.compose.enabled=false

# Database Configuration (H2 by default for local)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# OpenAI Configuration
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini
spring.ai.openai.chat.options.response-format.type=TEXT

spring.ai.openai.audio.transcription.options.model=whisper-1
spring.ai.openai.audio.transcription.options.language=pt
spring.ai.openai.audio.transcription.options.temperature=0
spring.ai.openai.audio.transcription.options.response-format=TEXT
spring.ai.openai.audio.transcription.options.prompt=Áudio em português brasileiro. \
As frases geralmente contem: \
    - um valor em reais(número + "reais"); \
    - uma ação(gastei,paguei,comprei); \
    - um local ou estabelecimento(mercado, farmacia, restaurante, loja, etc).

# Audio Speech Configuration
spring.ai.openai.audio.speech.options.model=tts-1
spring.ai.openai.audio.speech.options.voice=alloy
spring.ai.openai.audio.speech.options.speed=1.0
spring.ai.openai.audio.speech.options.response-format=mp3


logging.level.org.springframework.ai=DEBUG

# Application Directories Configuration
app.audio.output.path=audio-output
app.audio.temp.path=temp
app.audio.resources.path=src/main/resources/audio






# Development Profile - Docker Compose Configuration (Requires Docker)

# Database Configuration - MySQL via Docker Compose
spring.datasource.url=jdbc:mysql://localhost:3307/transaction
spring.datasource.username=app
spring.datasource.password=app
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (disabled in MySQL profile)
spring.h2.console.enabled=false

# Enable Docker Compose for development
spring.docker.compose.enabled=true
spring.docker.compose.file=compose.yml
